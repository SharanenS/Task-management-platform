spring:
  application:
    name: api-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Phase 1 only exposes health/info. Metrics/prometheus are added in the
        # observability phase once there is something meaningful to measure.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true

logging:
  level:
    root: INFO
    com.taskplatform: DEBUG
