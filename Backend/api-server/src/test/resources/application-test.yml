spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Actual datasource/redis connection details are injected at runtime by
# @DynamicPropertySource in the Testcontainers-backed integration test —
# they point at ephemeral containers, never at the dev docker-compose stack.
