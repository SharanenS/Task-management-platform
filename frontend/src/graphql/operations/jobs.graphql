query Jobs(
  $first: Int!
  $after: String
  $status: JobStatus
  $jobType: JobType
) {
  jobs(first: $first, after: $after, status: $status, jobType: $jobType) {
    nodes {
      id
      jobType
      status
      submitterEmployeeId
      payload {
        projectId
        format
        includeCompleted
      }
      version
      createdAt
      updatedAt
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query JobDetail($id: ID!) {
  job(id: $id) {
    id
    jobType
    status
    submitterEmployeeId
    payload {
      projectId
      format
      includeCompleted
    }
    version
    resultSummary
    resultContent
    resultContentType
    resultChecksum
    resultRowCount
    resultTruncated
    failureClassification
    completedAt
    executionGeneration
    retryExhausted
    manualRetryCount
    createdAt
    updatedAt
    publication {
      id
      status
      attemptCount
      nextRetryAt
      leaseExpiresAt
      publishedAt
      lastFailureClassification
      reconciliationRequired
    }
    attempts {
      id
      attemptNumber
      status
      startedAt
      finishedAt
      failureCode
      retryable
      safeSummary
      leaseAcquiredAt
      leaseExpiresAt
      lastHeartbeatAt
      abandonedAt
      retryScheduledAt
      recoveredAt
    }
  }
}

mutation RetryJob($jobId: ID!, $expectedVersion: Int!) {
  retryJob(jobId: $jobId, expectedVersion: $expectedVersion) {
    id
    status
    version
    executionGeneration
    retryExhausted
    manualRetryCount
  }
}

mutation DispatchJob($jobId: ID!, $expectedVersion: Int!) {
  dispatchJob(jobId: $jobId, expectedVersion: $expectedVersion) {
    id
    status
    version
    publication {
      status
      attemptCount
      nextRetryAt
      publishedAt
      lastFailureClassification
      reconciliationRequired
    }
  }
}

mutation SubmitProjectTaskExport($input: SubmitProjectTaskExportInput!) {
  submitProjectTaskExport(input: $input) {
    id
    status
  }
}

query JobPublications(
  $first: Int!
  $after: String
  $status: PublicationStatus
) {
  jobPublications(first: $first, after: $after, status: $status) {
    nodes {
      id
      status
      attemptCount
      nextRetryAt
      leaseExpiresAt
      publishedAt
      lastFailureClassification
      reconciliationRequired
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
