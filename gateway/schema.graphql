type AdminEmployee {
  id: ID!
  username: String!
  displayName: String!
  email: String!
  role: ApplicationRole!
  active: Boolean!
  provisioningStatus: ProvisioningStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
  version: Int!
}

enum ApplicationRole {
  ADMIN
  MANAGER
  MEMBER
}

input CreateProjectInput {
  key: String!
  name: String!
  description: String = null
}

input CreateTaskInput {
  title: String!
  description: String = null
  priority: TaskPriority! = MEDIUM
  assigneeEmployeeId: ID = null
  dueDate: Date = null
}

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

type EligibleEmployee {
  id: ID!
  displayName: String!
  email: String!
}

type EligibleEmployeeConnection {
  nodes: [EligibleEmployee!]!
  pageInfo: PageInfo!
}

type Employee {
  id: ID!
  displayName: String!
  email: String!
  role: ApplicationRole!
}

type EmployeeConnection {
  nodes: [AdminEmployee!]!
  pageInfo: PageInfo!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type Job {
  id: ID!
  jobType: JobType!
  status: JobStatus!
  submitterEmployeeId: ID!
  payload: ProjectTaskExportPayload!
  resultSummary: String
  resultContent: String
  resultContentType: String
  resultChecksum: String
  resultRowCount: Int
  resultTruncated: Boolean
  failureClassification: String
  completedAt: DateTime
  executionGeneration: Int!
  retryExhausted: Boolean!
  manualRetryCount: Int!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  attempts: [JobAttempt!]!
  publication: JobPublication
}

type JobAttempt {
  id: ID!
  attemptNumber: Int!
  status: JobAttemptStatus!
  startedAt: DateTime!
  finishedAt: DateTime
  failureCode: String
  retryable: Boolean!
  safeSummary: String
  leaseAcquiredAt: DateTime
  leaseExpiresAt: DateTime
  lastHeartbeatAt: DateTime
  abandonedAt: DateTime
  retryScheduledAt: DateTime
  recoveredAt: DateTime
}

enum JobAttemptStatus {
  RUNNING
  SUCCEEDED
  FAILED
  RETRY_SCHEDULED
  ABANDONED
}

type JobConnection {
  nodes: [Job!]!
  pageInfo: PageInfo!
}

type JobPublication {
  id: ID!
  status: PublicationStatus!
  attemptCount: Int!
  nextRetryAt: DateTime
  leaseExpiresAt: DateTime
  publishedAt: DateTime
  lastFailureClassification: String
  reconciliationRequired: Boolean!
}

enum JobStatus {
  SUBMITTED
  QUEUED
  RUNNING
  SUCCEEDED
  FAILED
  CANCELLED
}

enum JobType {
  PROJECT_TASK_EXPORT
}

type Mutation {
  dispatchJob(jobId: ID!, expectedVersion: Int!): Job!
  retryJob(jobId: ID!, expectedVersion: Int!): Job!
  submitProjectTaskExport(input: SubmitProjectTaskExportInput!): Job!
  provisionEmployee(input: ProvisionEmployeeInput!): AdminEmployee!
  updateEmployeeRole(employeeId: ID!, role: ApplicationRole!): AdminEmployee!
  setEmployeeActive(employeeId: ID!, active: Boolean!): AdminEmployee!
  reconcileEmployee(employeeId: ID!): AdminEmployee!
  createProject(input: CreateProjectInput!): Project!
  updateProject(projectId: ID!, input: UpdateProjectInput!): Project!
  setProjectStatus(projectId: ID!, status: ProjectStatus!, expectedVersion: Int!): Project!
  addProjectMember(projectId: ID!, employeeId: ID!, role: ProjectRole!): Project!
  updateProjectMemberRole(projectId: ID!, employeeId: ID!, role: ProjectRole!): Project!
  removeProjectMember(projectId: ID!, employeeId: ID!): Project!
  createTask(projectId: ID!, input: CreateTaskInput!): Task!
  updateTask(projectId: ID!, taskId: ID!, input: UpdateTaskInput!): Task!
  assignTask(projectId: ID!, taskId: ID!, assigneeEmployeeId: ID, expectedVersion: Int!): Task!
  changeTaskStatus(projectId: ID!, taskId: ID!, status: TaskStatus!, expectedVersion: Int!): Task!
  addTaskComment(projectId: ID!, taskId: ID!, body: String!): TaskComment!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Project {
  id: ID!
  key: String!
  name: String!
  description: String
  status: ProjectStatus!
  creatorEmployeeId: ID!
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  memberships: [ProjectMembership!]!
}

type ProjectConnection {
  nodes: [Project!]!
  pageInfo: PageInfo!
}

type ProjectMembership {
  id: ID!
  employeeId: ID!
  role: ProjectRole!
  createdAt: DateTime!
  displayName: String
  email: String
}

enum ProjectRole {
  PROJECT_MANAGER
  CONTRIBUTOR
}

enum ProjectStatus {
  DRAFT
  ACTIVE
  ARCHIVED
}

type ProjectTaskExportPayload {
  projectId: ID!
  format: String!
  includeCompleted: Boolean!
}

input ProvisionEmployeeInput {
  idempotencyKey: String!
  username: String!
  email: String!
  displayName: String!
  role: ApplicationRole!
  active: Boolean!
  temporaryPassword: String!
}

enum ProvisioningStatus {
  COMPLETE
  RECONCILIATION_REQUIRED
}

type PublicationConnection {
  nodes: [JobPublication!]!
  pageInfo: PageInfo!
}

enum PublicationStatus {
  PENDING
  IN_FLIGHT
  PUBLISHED
  FAILED
  RECONCILIATION_REQUIRED
}

type Query {
  systemInfo: SystemInfo!
  me: Employee!
  jobs(first: Int! = 20, after: String = null, status: JobStatus = null, jobType: JobType = null): JobConnection!
  jobPublications(first: Int! = 20, after: String = null, status: PublicationStatus = null): PublicationConnection!
  job(id: ID!): Job!
  employees(first: Int! = 20, after: String = null, search: String = null, role: ApplicationRole = null, active: Boolean = null): EmployeeConnection!
  employee(id: ID!): AdminEmployee!
  projects(first: Int! = 20, after: String = null, search: String = null, status: ProjectStatus = null): ProjectConnection!
  project(id: ID!): Project!
  eligibleProjectMembers(first: Int! = 20, after: String = null, search: String = null): EligibleEmployeeConnection!
  projectTasks(projectId: ID!, first: Int! = 20, after: String = null, search: String = null, status: TaskStatus = null, priority: TaskPriority = null, assigneeEmployeeId: ID = null, unassigned: Boolean! = false): TaskConnection!
  projectTaskBoard(projectId: ID!, laneSize: Int! = 20): TaskBoard!
  task(projectId: ID!, taskId: ID!): Task!
  taskComments(projectId: ID!, taskId: ID!, first: Int! = 20, after: String = null): TaskCommentConnection!
  taskActivity(projectId: ID!, taskId: ID!, first: Int! = 20, after: String = null): TaskActivityConnection!
}

input SubmitProjectTaskExportInput {
  projectId: ID!
  includeCompleted: Boolean! = true
  idempotencyKey: String!
}

type SystemInfo {
  name: String!
  version: String!
  environment: String!
  status: String!
}

type Task {
  id: ID!
  projectId: ID!
  reference: String!
  number: Int!
  title: String!
  description: String
  status: TaskStatus!
  priority: TaskPriority!
  assigneeEmployeeId: ID
  assigneeDisplayName: String
  creatorEmployeeId: ID!
  dueDate: Date
  version: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TaskActivity {
  id: ID!
  taskId: ID!
  actorEmployeeId: ID!
  actorDisplayName: String
  activityType: TaskActivityType!
  changeData: JSON!
  createdAt: DateTime!
}

type TaskActivityConnection {
  nodes: [TaskActivity!]!
  pageInfo: PageInfo!
}

enum TaskActivityType {
  CREATED
  METADATA_UPDATED
  ASSIGNMENT_CHANGED
  STATUS_CHANGED
  COMMENT_ADDED
}

type TaskBoard {
  lanes: [TaskBoardLane!]!
}

type TaskBoardLane {
  status: TaskStatus!
  tasks: [Task!]!
  hasMore: Boolean!
}

type TaskComment {
  id: ID!
  taskId: ID!
  authorEmployeeId: ID!
  authorDisplayName: String
  body: String!
  createdAt: DateTime!
}

type TaskCommentConnection {
  nodes: [TaskComment!]!
  pageInfo: PageInfo!
}

type TaskConnection {
  nodes: [Task!]!
  pageInfo: PageInfo!
}

enum TaskPriority {
  LOW
  MEDIUM
  HIGH
  URGENT
}

enum TaskStatus {
  TODO
  IN_PROGRESS
  BLOCKED
  DONE
  CANCELLED
}

input UpdateProjectInput {
  name: String!
  description: String
  expectedVersion: Int!
}

input UpdateTaskInput {
  title: String!
  description: String
  priority: TaskPriority!
  dueDate: Date
  expectedVersion: Int!
}
