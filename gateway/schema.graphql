enum ApplicationRole {
  ADMIN
  MANAGER
  MEMBER
}

type Employee {
  id: ID!
  displayName: String!
  email: String!
  role: ApplicationRole!
}

type Query {
  systemInfo: SystemInfo!
  me: Employee!
}

type SystemInfo {
  name: String!
  version: String!
  environment: String!
  status: String!
}
