type AccountAdministration {
  accounts: [ManagedAccount!]!
  operations: [ProvisioningOperation!]!
  history: [AccountHistory!]!
  hasMore: Boolean!
}

type AccountCommandResult {
  operationId: ID!
  state: String!
}

type AccountHistory {
  id: ID!
  actorId: ID!
  targetId: ID
  action: String!
  state: String!
  before: String!
  after: String!
  createdAt: String!
}

type AdminWorkspace {
  viewer: Viewer!
}

type AvailableAccount {
  id: ID!
  companyRole: String!
}

type CalendarConfiguration {
  timezone: String!
  week: [CalendarWeekday!]!
  holidays: [CalendarHoliday!]!
  exceptions: [CalendarException!]!
}

input CalendarConfigurationInput {
  timezone: String!
  week: [CalendarWeekdayInput!]!
  holidays: [CalendarHolidayInput!]!
  exceptions: [CalendarExceptionInput!]!
}

type CalendarException {
  date: String!
  label: String!
  working: Boolean!
  opens: String
  closes: String
}

input CalendarExceptionInput {
  date: String!
  label: String!
  working: Boolean!
  opens: String = null
  closes: String = null
}

type CalendarHistory {
  tzdbVersion: String!
  id: ID!
  number: Int!
  actorId: ID!
  createdAt: String!
}

type CalendarHoliday {
  date: String!
  label: String!
}

input CalendarHolidayInput {
  date: String!
  label: String!
}

type CalendarWeekday {
  weekday: Int!
  working: Boolean!
  opens: String
  closes: String
}

input CalendarWeekdayInput {
  weekday: Int!
  working: Boolean!
  opens: String = null
  closes: String = null
}

input ChangeAccountInput {
  requestId: ID!
  accountId: ID!
  version: Int!
  action: String!
  role: String = null
}

type CompanyCalendarPreview {
  tzdbVersion: String!
  previewId: ID!
  baseNumber: Int!
  expiresAt: String!
  config: CalendarConfiguration!
  changedSections: [String!]!
}

type CompanyCalendarVersion {
  tzdbVersion: String!
  id: ID!
  number: Int!
  actorId: ID!
  createdAt: String!
  config: CalendarConfiguration!
}

type CompanyCalendarWorkspace {
  current: CompanyCalendarVersion
  history: [CalendarHistory!]!
}

input CreateAccountInput {
  requestId: ID!
  username: String!
  email: String!
  displayName: String!
  role: String!
  employeeId: ID = null
}

input CreateProjectInput {
  requestId: ID!
  previewId: ID!
  confirm: Boolean!
}

type EmployeeChoice {
  id: ID!
  displayName: String!
}

type ManagedAccount {
  id: ID!
  displayName: String!
  username: String!
  email: String!
  active: Boolean!
  profileActive: Boolean!
  role: String!
  version: Int!
}

type ManagedEmployee {
  id: ID!
  displayName: String!
  active: Boolean!
  version: Int!
  accountId: ID
  companyRole: String!
  departmentId: ID
  jobTitleId: ID
  managerId: ID
}

type Mutation {
  changeOrganization(input: OrganizationChangeInput!): OrganizationChangeResult!
  previewCompanyCalendar(input: CalendarConfigurationInput!): CompanyCalendarPreview!
  publishCompanyCalendar(input: PublishCalendarInput!): CompanyCalendarVersion!
  previewProject(input: ProjectPreviewInput!): ProjectCreationPreview!
  createProject(input: CreateProjectInput!): ProjectRecord!
  createAccount(input: CreateAccountInput!): AccountCommandResult!
  changeAccount(input: ChangeAccountInput!): AccountCommandResult!
  recoverAccount(input: RecoverAccountInput!): AccountCommandResult!
}

input OrganizationChangeInput {
  requestId: ID!
  action: String!
  entityId: ID = null
  kind: String = null
  name: String = null
  version: Int = null
  active: Boolean = null
  departmentId: ID = null
  jobTitleId: ID = null
  managerId: ID = null
  accountId: ID = null
}

type OrganizationChangeResult {
  entityId: ID!
  state: String!
}

type OrganizationHistory {
  id: ID!
  action: String!
  entityKind: String!
  entityName: String!
  actorName: String!
  createdAt: String!
}

type OrganizationUnit {
  id: ID!
  name: String!
  active: Boolean!
  version: Int!
}

type OrganizationWorkspace {
  departments: [OrganizationUnit!]!
  jobTitles: [OrganizationUnit!]!
  employees: [ManagedEmployee!]!
  hasMore: Boolean!
  managerOptions: [EmployeeChoice!]!
  unlinkedEmployees: [EmployeeChoice!]!
  availableAccounts: [AvailableAccount!]!
  history: [OrganizationHistory!]!
}

type ProjectCalendarReference {
  id: ID!
  number: Int!
  timezone: String!
  tzdbVersion: String!
}

type ProjectCreationPreview {
  previewId: ID!
  name: String!
  objectives: String!
  deadlineDate: String!
  approvedDeadline: String!
  deadlineLocal: String!
  calendarNumber: Int!
  timezone: String!
  tzdbVersion: String!
  expiresAt: String!
  pastDeadline: Boolean!
}

input ProjectPreviewInput {
  name: String!
  objectives: String!
  deadlineDate: String!
}

type ProjectRecord {
  id: ID!
  name: String!
  objectives: String!
  creatorId: ID!
  creatorName: String!
  ownerId: ID!
  ownerName: String!
  deadlineDate: String!
  approvedDeadline: String!
  deadlineLocal: String!
  calendarVersionId: ID!
  calendarNumber: Int!
  timezone: String!
  tzdbVersion: String!
  createdAt: String!
  version: Int!
}

type ProjectWorkspace {
  projects: [ProjectRecord!]!
  hasMore: Boolean!
  calendar: ProjectCalendarReference
}

type ProvisioningOperation {
  id: ID!
  username: String!
  email: String!
  state: String!
  failureCode: String
}

input PublishCalendarInput {
  previewId: ID!
  requestId: ID!
  confirm: Boolean!
}

type Query {
  organizationWorkspace(page: Int! = 0, search: String! = ""): OrganizationWorkspace!
  companyCalendar: CompanyCalendarWorkspace!
  calculateWorkingDays(input: WorkingDaysInput!): WorkingDaysResult!
  projectWorkspace(page: Int! = 0, search: String! = ""): ProjectWorkspace!
  project(id: ID!): ProjectRecord!
  viewer: Viewer!
  adminWorkspace: AdminWorkspace!
  accountAdministration(page: Int! = 0): AccountAdministration!
}

input RecoverAccountInput {
  requestId: ID!
  operationId: ID!
}

type Viewer {
  accountId: ID!
  employeeId: ID!
  displayName: String!
  companyRoles: [String!]!
  permissions: [String!]!
}

input WorkingDaysInput {
  versionId: ID!
  start: String!
  duration: Int!
}

type WorkingDaysResult {
  tzdbVersion: String!
  versionId: ID!
  versionNumber: Int!
  requestedStart: String!
  effectiveStart: String!
  adjusted: Boolean!
  duration: Int!
  countedDates: [String!]!
  timezone: String!
  startsAt: String!
  dueAt: String!
  dueLocal: String!
  nextHandoff: String!
}
